[project]
name = "capestone-project-1234"
version = "0.1.0"
description = "Speech Emotion Recognition App"
requires-python = "==3.11.*"
dependencies = [
    "flask",
    "numpy>=1.23.5,<2.0.0",
    "librosa",
    "scikit-learn==1.3.0",
    "joblib",
    "imageio-ffmpeg",
    "gunicorn",
    "resampy",
    "tensorflow-cpu==2.15.0",
    "opencv-python-headless",
    "fer>=22.5.1",
    "flask-sqlalchemy",
    "werkzeug>=1.0.1",
    "uvicorn>=0.24"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
