[project]
name = "capestone-project-1234"
version = "0.1.0"
dependencies = [
    "flask",
    "numpy>=1.26.0",
    "librosa",
    "scikit-learn==1.3.0",
    "joblib",
    "imageio-ffmpeg",
    "gunicorn",
    "resampy",
    "opencv-python-headless",
    "flask-sqlalchemy",
    "werkzeug>=3.0.1",
    "uvicorn>=0.24"
]

[tool.setuptools]
packages = []
py-modules = ["app", "analysis", "database", "utils", "mlp_model", "mlp_prediction"]

[tool.uv]
package = false

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
