{% extends 'layout.html' %}

{% block body %}
<center>
    <br>
    <h1>Emotion Recognition</h1>
    <style>
        h1 {
            font-weight: bold;
            color: #4B0082;
        }

        .upload-container {
            max-width: 600px;
            margin: 30px auto;
            padding: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .upload-form {
            background: white;
            padding: 30px;
            border-radius: 15px;
        }

        .form-label {
            font-size: 1.2rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            display: block;
        }

        .file-input {
            width: 100%;
            padding: 15px;
            border: 2px dashed #667eea;
            border-radius: 10px;
            margin: 15px 0;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-input:hover {
            border-color: #764ba2;
            background: #f8f9ff;
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 15px 40px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .file-info {
            font-size: 0.9rem;
            color: #666;
            margin-top: 10px;
            font-style: italic;
        }

        .file-size-display {
            margin-top: 10px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 5px;
            font-size: 0.9rem;
            display: none;
        }
    </style>
    <div class="upload-container">
        <form id="prediction-form" action="/predict" method="POST" enctype="multipart/form-data" class="upload-form">
            <label for="audio_file" class="form-label">📁 Upload Audio or Video File</label>
            <input type="file" id="audio_file" name="audio_file" accept="audio/*,video/*" required class="file-input">
            <div class="file-info">
                ✅ Supported formats: WAV, MP3, OGG, FLAC, M4A, MP4, AVI, MOV, MKV, WEBM<br>
                📊 Maximum file size: 100GB
            </div>
            <div id="file-size-display" class="file-size-display"></div>
            <input type="submit" value="🎯 Predict Emotion" class="submit-btn">
        </form>
    </div>

    <script>
        // Display file size when selected
        document.getElementById('audio_file').addEventListener('change', function (e) {
            const file = e.target.files[0];
            const display = document.getElementById('file-size-display');

            if (file) {
                const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
                const maxSizeMB = 100 * 1024; // 100GB

                display.style.display = 'block';

                if (sizeMB > maxSizeMB) {
                    display.style.color = 'red';
                    display.innerHTML = `⚠️ File size: ${sizeMB}MB - Too large! Maximum is ${maxSizeMB / 1024}GB`;
                } else {
                    display.style.color = 'green';
                    display.innerHTML = `✅ File size: ${sizeMB}MB - Ready to upload`;
                }
            } else {
                display.style.display = 'none';
            }
        });

        // Validate before submit and show loading state
        document.getElementById('prediction-form').addEventListener('submit', function (e) {
            const file = document.getElementById('audio_file').files[0];
            if (file) {
                const sizeMB = file.size / (1024 * 1024);
                if (sizeMB > 100 * 1024) { // 100GB
                    e.preventDefault();
                    alert('File is too large! Maximum size is 100GB. Your file is ' + sizeMB.toFixed(2) + 'MB');
                    return false;
                }
            }

            // Show loading state
            const btn = document.querySelector('.submit-btn');
            btn.value = '⏳ Processing... Please wait';
            btn.style.opacity = '0.7';
            btn.style.cursor = 'wait';
            // We don't disable immediately to ensure form submission happens, 
            // but we change the text to deter re-clicks.
        });
    </script>
    <br><br><br>
</center>
{% endblock %}
