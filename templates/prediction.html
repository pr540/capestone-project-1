{% extends 'layout.html' %}

{% block body %}
<section class="predict-section">
    <div class="overlay-predict">
        <div class="upload-container">
            <h1 class="text-white mb-4 text-center">Emotion Recognition</h1>
            <div class="about-card p-4 rounded-lg shadow-lg">
                <form id="prediction-form" action="/predict" method="POST" enctype="multipart/form-data" class="upload-form">
                    <div class="upload-box mb-4">
                        <label for="audio_file" class="custom-file-upload">
                            <i class="fas fa-cloud-upload-alt"></i> <span>Choose Audio or Video File</span>
                        </label>
                        <input type="file" id="audio_file" name="audio_file" accept="audio/*,video/*" required class="d-none">
                        <div id="file-name-display" class="file-name-display text-white mt-2 font-italic"></div>
                    </div>
                    <div class="file-info text-light mb-4 small">
                        <div class="info-item"><i class="fas fa-check-circle text-success mr-2"></i> WAV, MP3, OGG, FLAC, M4A, MP4, AVI,
                            MOV, MKV, WEBM</div>
                        <div class="info-item"><i class="fas fa-info-circle text-warning mr-2"></i> Maximum file size: 4.5MB (Vercel limit)
                        </div>
                    </div>
                    
                    <div id="file-size-display" class="file-size-display mb-4"></div>
                    
                    <button type="submit" id="predict-btn" class="submit-btn w-100" disabled>
                        <i class="fas fa-bullseye mr-2"></i> Predict Emotion
                    </button>
                </form>
            </div>
            </div>
    </div>
</section>

<style>
    .custom-file-upload {
        display: block;
        padding: 15px 25px;
        cursor: pointer;
        background: rgba(232, 205, 48, 0.2);
        color: #e8cd30;
        border: 2px dashed #e8cd30;
        border-radius: 10px;
        text-align: center;
        transition: all 0.3s ease;
        font-weight: bold;
    }

    .custom-file-upload:hover {
        background: rgba(232, 205, 48, 0.3);
        transform: scale(1.02);
    }

    .file-name-display {
        background: rgba(255, 255, 255, 0.1);
        padding: 8px 15px;
        border-radius: 5px;
        text-align: center;
        display: none;
    }

    .info-item {
        margin-bottom: 5px;
    }

    .submit-btn {
        background: #e8cd30;
        color: #111;
        border: none;
        padding: 15px;
        border-radius: 8px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: all 0.3s ease;
        opacity: 0.5;
        cursor: not-allowed;
    }

    .submit-btn:enabled {
        opacity: 1;
        cursor: pointer;
        box-shadow: 0 4px 15px rgba(232, 205, 48, 0.4);
    }

    .submit-btn:enabled:hover {
        background: #f8db40;
        transform: translateY(-2px);
    }
</style>

<script>
        // Display file info and enable predict button when selected
        document.getElementById('audio_file').addEventListener('change', function (e) {
            const file = e.target.files[0];
        const nameDisplay = document.getElementById('file-name-display');
        const sizeDisplay = document.getElementById('file-size-display');
        const predictBtn = document.getElementById('predict-btn');

        if (file) {
            nameDisplay.innerHTML = `<i class="fas fa-file-alt mr-2"></i> ${file.name}`;
            nameDisplay.style.display = 'block';
            
            const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
            const maxSizeMB = 4.5; // Vercel limit

            if (sizeMB > maxSizeMB) {
                sizeDisplay.style.color = '#ff4d4d';
                sizeDisplay.innerHTML = `⚠️ File size: ${sizeMB}MB - Too large! Maximum is ${maxSizeMB}MB`;
                predictBtn.disabled = true;
            } else {
                sizeDisplay.style.color = '#4dff4d';
                sizeDisplay.innerHTML = `✅ File size: ${sizeMB}MB - Ready for analysis`;
                predictBtn.disabled = false;
            }
        } else {
            nameDisplay.style.display = 'none';
            sizeDisplay.innerHTML = '';
            predictBtn.disabled = true;
        }
    });

        // Handle form submission with loading state
        document.getElementById('prediction-form').addEventListener('submit', function (e) {
        const btn = document.getElementById('predict-btn');
        btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Analyzing... Please wait';
        btn.disabled = true;
        btn.style.opacity = '0.7';
    });
    </script>
<br><br><br>
{% endblock %}
